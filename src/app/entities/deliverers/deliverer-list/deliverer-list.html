<h2>Livreurs</h2>

<div class="header-controls">
  <button *ngIf="isAdmin" mat-raised-button color="primary" (click)="goToAdd()">
    Ajouter un livreur
  </button>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Recherche nom/prénom</mat-label>
      <input matInput [(ngModel)]="searchNom" (input)="resetFilters()" placeholder="Karim, Youssef...">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Adresse</mat-label>
      <input matInput [(ngModel)]="filterAdresse" (input)="resetFilters()" placeholder="Casablanca...">
    </mat-form-field>

    <mat-checkbox [(ngModel)]="onlyAvailable" (change)="resetFilters()">
      Seulement les disponibles
    </mat-checkbox>
  </div>
</div>

<table mat-table [dataSource]="filtered" class="mat-elevation-z4">

  <!-- Colonne ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let d">{{d.id}}</td>
  </ng-container>

  <!-- Colonne Nom -->
  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let d">{{d.nom}}</td>
  </ng-container>

  <!-- Colonne Prénom -->
  <ng-container matColumnDef="prenom">
    <th mat-header-cell *matHeaderCellDef>Prénom</th>
    <td mat-cell *matCellDef="let d">{{d.prenom}}</td>
  </ng-container>

  <!-- Colonne Téléphone -->
  <ng-container matColumnDef="telephone">
    <th mat-header-cell *matHeaderCellDef>Téléphone</th>
    <td mat-cell *matCellDef="let d">{{d.telephone}}</td>
  </ng-container>

  <!-- Colonne Adresse -->
  <ng-container matColumnDef="adresse">
    <th mat-header-cell *matHeaderCellDef>Adresse</th>
    <td mat-cell *matCellDef="let d">{{d.adresse}}</td>
  </ng-container>

  <!-- Colonne Disponible -->
  <ng-container matColumnDef="disponible">
    <th mat-header-cell *matHeaderCellDef>Disponible</th>
    <td mat-cell *matCellDef="let d">
      <mat-icon *ngIf="d.disponible" color="primary">check_circle</mat-icon>
      <mat-icon *ngIf="!d.disponible" color="warn">cancel</mat-icon>
    </td>
  </ng-container>

  <!-- Colonne Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let d">
      <button mat-icon-button color="primary" (click)="edit(d.id)" *ngIf="isAdmin">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(d.id)" *ngIf="isAdmin">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
  [length]="total"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  (page)="onPageChange($event)"
  showFirstLastButtons>
</mat-paginator>
