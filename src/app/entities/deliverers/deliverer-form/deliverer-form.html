<h2>{{ isEdit ? 'Modifier le livreur' : 'Nouveau livreur' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom</mat-label>
    <input matInput formControlName="nom" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Prénom</mat-label>
    <input matInput formControlName="prenom" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Téléphone</mat-label>
    <input matInput formControlName="telephone" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Adresse</mat-label>
    <input matInput formControlName="adresse" required />
  </mat-form-field>

  <mat-checkbox formControlName="disponible" color="primary">
    Disponible pour livraison
  </mat-checkbox>

  <div class="actions">
    <button mat-raised-button color="primary" type="submit"
            [disabled]="form.invalid || !isAdmin">
      {{ isEdit ? 'Enregistrer' : 'Ajouter' }}
    </button>
    <button mat-button type="button" (click)="cancel()">Annuler</button>
  </div>

  <div *ngIf="!isAdmin" class="warning">
    Mode lecture seule (agent)
  </div>
</form>
