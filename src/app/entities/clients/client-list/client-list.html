<h2>Liste des Clients</h2>

<div class="header-controls">
  <button *ngIf="isAdmin" mat-raised-button color="primary" (click)="goToAdd()">
    Ajouter un client
  </button>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Recherche par nom</mat-label>
      <input matInput [(ngModel)]="searchNom" (input)="resetPageAndFilter()" placeholder="Dupont, Ahmed...">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filtre par adresse</mat-label>
      <input matInput [(ngModel)]="filterAdresse" (input)="resetPageAndFilter()" placeholder="Casablanca...">
    </mat-form-field>
  </div>
</div>

<table mat-table [dataSource]="filteredClients" class="mat-elevation-z4">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let c">{{c.id}}</td>
  </ng-container>
  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let c">{{c.nom}}</td>
  </ng-container>
  <ng-container matColumnDef="prenom">
    <th mat-header-cell *matHeaderCellDef>Prénom</th>
    <td mat-cell *matCellDef="let c">{{c.prenom}}</td>
  </ng-container>
  <ng-container matColumnDef="telephone">
    <th mat-header-cell *matHeaderCellDef>Téléphone</th>
    <td mat-cell *matCellDef="let c">{{c.telephone}}</td>
  </ng-container>
  <ng-container matColumnDef="adresse">
    <th mat-header-cell *matHeaderCellDef>Adresse</th>
    <td mat-cell *matCellDef="let c">{{c.adresse}}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let c">
      <button mat-icon-button color="primary" (click)="edit(c.id)" *ngIf="isAdmin"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button color="warn" (click)="delete(c.id)" *ngIf="isAdmin"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [length]="total" [pageSize]="pageSize" [pageSizeOptions]="[5,10,20,50]"
               (page)="onPageChange($event)" showFirstLastButtons></mat-paginator>
