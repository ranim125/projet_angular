<h2>{{ isEdit ? 'Modifier le client' : 'Nouveau client' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="client-form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom</mat-label>
    <input matInput formControlName="nom" required />
    <mat-error *ngIf="form.get('nom')?.hasError('required')">Obligatoire</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Prénom</mat-label>
    <input matInput formControlName="prenom" required />
    <mat-error *ngIf="form.get('prenom')?.hasError('required')">Obligatoire</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Téléphone</mat-label>
    <input matInput formControlName="telephone" placeholder="06xxxxxxxx" />
    <mat-error *ngIf="form.get('telephone')?.hasError('minlength')">10 chiffres minimum</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Adresse</mat-label>
    <input matInput formControlName="adresse" required />
    <mat-error *ngIf="form.get('adresse')?.hasError('required')">Obligatoire</mat-error>
  </mat-form-field>

  <div class="actions">
    <button mat-raised-button color="primary" type="submit"
            [disabled]="form.invalid || !isAdmin">
      {{ isEdit ? 'Enregistrer' : 'Ajouter' }}
    </button>
    <button mat-button type="button" (click)="goBack()">Annuler</button>
  </div>

  <div *ngIf="!isAdmin" class="warning">
    Vous êtes en mode lecture seule (agent).
  </div>
</form>
