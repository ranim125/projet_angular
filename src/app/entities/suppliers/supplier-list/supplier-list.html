<h2>Liste des Fournisseurs</h2>

<!-- Bouton Ajouter + Filtres -->
<div class="header-controls">
  <button 
    *ngIf="isAdmin" 
    mat-raised-button 
    color="primary" 
    (click)="goToAdd()">
    Ajouter un fournisseur
  </button>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Recherche par nom</mat-label>
      <input 
        matInput 
        [(ngModel)]="searchNom" 
        (input)="resetPageAndFilter()"
        placeholder="ex: AgroFournil">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filtre par adresse</mat-label>
      <input 
        matInput 
        [(ngModel)]="filterAdresse" 
        (input)="resetPageAndFilter()"
        placeholder="ex: Casablanca">
    </mat-form-field>
  </div>
</div>

<!-- Tableau -->
<table mat-table [dataSource]="filteredSuppliers" class="mat-elevation-z4">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let s"> {{s.id}} </td>
  </ng-container>

  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef> Nom </th>
    <td mat-cell *matCellDef="let s"> {{s.nom}} </td>
  </ng-container>

  <ng-container matColumnDef="adresse">
    <th mat-header-cell *matHeaderCellDef> Adresse </th>
    <td mat-cell *matCellDef="let s"> {{s.adresse}} </td>
  </ng-container>

  <ng-container matColumnDef="telephone">
    <th mat-header-cell *matHeaderCellDef> Téléphone </th>
    <td mat-cell *matCellDef="let s"> {{s.telephone}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let s"> {{s.email}} </td>
  </ng-container>

  <ng-container matColumnDef="region">
    <th mat-header-cell *matHeaderCellDef> Région </th>
    <td mat-cell *matCellDef="let s"> {{s.region}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let s">
      <button mat-icon-button color="primary" (click)="edit(s.id)" *ngIf="isAdmin">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(s.id)" *ngIf="isAdmin">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- Pagination -->
<mat-paginator
  [length]="total"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20, 50]"
  (page)="onPageChange($event)"
  showFirstLastButtons>
</mat-paginator>

<!-- Message si vide -->
<div *ngIf="filteredSuppliers.length === 0" class="no-data">
  Aucun fournisseur trouvé
</div>
