<h2>Liste des Agents</h2>

<div class="header-controls">
  <button mat-raised-button color="primary" (click)="goToAdd()">
    Ajouter un agent
  </button>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Recherche par nom</mat-label>
      <input matInput [(ngModel)]="searchNom" (input)="resetPageAndFilter()">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filtrer par rôle</mat-label>
      <input matInput [(ngModel)]="filterRole" (input)="resetPageAndFilter()">
    </mat-form-field>
  </div>
</div>

<table mat-table [dataSource]="filteredAgents" class="mat-elevation-z4">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let a">{{a.id}}</td>
  </ng-container>

  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let a">{{a.nom}}</td>
  </ng-container>

  <ng-container matColumnDef="prenom">
    <th mat-header-cell *matHeaderCellDef>Prénom</th>
    <td mat-cell *matCellDef="let a">{{a.prenom}}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let a">{{a.email}}</td>
  </ng-container>

  <ng-container matColumnDef="telephone">
    <th mat-header-cell *matHeaderCellDef>Téléphone</th>
    <td mat-cell *matCellDef="let a">{{a.telephone}}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Rôle</th>
    <td mat-cell *matCellDef="let a">{{a.role}}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let a">
      <button mat-icon-button (click)="edit(a.id)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button color="warn" (click)="delete(a.id)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator
  [length]="total"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5,10,20,50]"
  (page)="onPageChange($event)">
</mat-paginator>
