<div class="header">

  <button mat-raised-button class="btn-primary rounded-full" (click)="goToAdd()">
    <mat-icon>add</mat-icon> Ajouter une catégorie
  </button>

  <mat-form-field appearance="outline" class="search">
    <mat-label>Rechercher</mat-label>
    <input matInput [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="Nom..." />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

</div>

<table mat-table [dataSource]="filteredAndPaged" class="mat-elevation-z2 rounded-table">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let cat"> 
      <span class="id-badge rounded-full">{{cat.id}}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Nom </th>
    <td mat-cell *matCellDef="let cat"> {{cat.name}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
    <td mat-cell *matCellDef="let cat" class="actions-cell">
      <button mat-icon-button class="btn-edit rounded-full" (click)="edit(cat)" matTooltip="Modifier">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button class="btn-delete rounded-full" (click)="delete(cat.id)" matTooltip="Supprimer">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator
  [length]="totalItems"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  (page)="onPageChange($event)"
  class="rounded-paginator">
</mat-paginator>
