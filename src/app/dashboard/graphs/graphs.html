<!-- graphs.html -->
<div class="graphs-container">
  

  <div class="charts-grid">
    <mat-card class="chart-card">
      <mat-card-header><mat-card-title>Produits en stock par catégorie</mat-card-title></mat-card-header>
      <mat-card-content><canvas #barCanvas></canvas></mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header><mat-card-title>Produits en rupture</mat-card-title></mat-card-header>
      <mat-card-content><canvas #doughnutCanvas></canvas></mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header><mat-card-title>Fournisseurs par région</mat-card-title></mat-card-header>
      <mat-card-content><canvas #pieSuppliersCanvas></canvas></mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header><mat-card-title>Clients par région</mat-card-title></mat-card-header>
      <mat-card-content><canvas #pieClientsCanvas></canvas></mat-card-content>
    </mat-card>
  </div>
</div>
