<h2>{{ isEdit ? 'Modifier le produit' : 'Nouveau produit' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom du produit</mat-label>
    <input matInput formControlName="name" placeholder="Ex: Ordinateur" />
    <mat-error *ngIf="form.get('name')?.hasError('required')">
      Le nom est obligatoire
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Prix</mat-label>
    <input matInput type="number" formControlName="price" placeholder="Ex: 1999" />
    <mat-error *ngIf="form.get('price')?.hasError('required')">
      Le prix est obligatoire
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Catégorie</mat-label>
    <mat-select formControlName="categoryId">
      <mat-option *ngFor="let c of categories" [value]="c.id">
        {{ c.name }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('categoryId')?.hasError('required')">
      Catégorie obligatoire
    </mat-error>
  </mat-form-field>

  <mat-checkbox formControlName="inStock">
    En stock
  </mat-checkbox>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput rows="3" formControlName="description"></textarea>
  </mat-form-field>

  <div class="actions">
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      {{ isEdit ? 'Enregistrer' : 'Ajouter' }}
    </button>
    <button mat-button type="button" (click)="goBack()">Annuler</button>
  </div>

</form>
